name: ofmai_signup_tiktok
display_name: OFMAI TikTok signup
description: >-
  Creates one TikTok account on a character's own phone, BY ITS OWN US LINE,
  with a human at every gate. Day 3 of the phone — docs/social/account-creation.md
  §6.2 and §4 ter. Walked on a device: an email signup is accepted then blocked
  behind "link your phone number" with no way back; the phone-first flow created
  @jordan.reed90 on 2026-09-18 (screens-tiktok-actions.md §6).
version: "0.2.0"
kind: hard
app_package: com.zhiliaoapp.musically
android_package: com.zhiliaoapp.musically
platforms:
  - android
author: OFMAI
license: MIT

health_platform: tiktok

# The AIGC label is NOT a setting of the account and is never touched here: it is
# posted post by post, from params.aigc_label of the publication order (R2, R3,
# publishing.md §1.1). A signup that flipped an "AI" switch would decide for the
# whole 3-of-6 disclosure test.
exports:
  workflows:
    - name: recorded
      description: TikTok signup by the character's own US line, human gates
      params:
        phone: { type: string, required: true, description: "the character's own US line, digits only, never shared (account-creation.md §4 ter)" }
        email: { type: string, required: true, description: "the character's own mailbox, only if TikTok asks for a recovery address" }
        handle: { type: string, required: true }
        name: { type: string, required: true }
        birthday: { type: string, required: true, description: "YYYY-MM-DD, 18+ (R2)" }
        bio: { type: string, required: true, description: "persona sheet, ASCII, 80 chars, no link (R12, R22)" }

popup_detectors:
  - detect: "Choose your interests"
    button: "Skip"
    label: "Interest picker"
  - detect: "connect with people"
    button: "Don't allow"
    label: "Contacts access popup"
  - detect: "access to your Facebook"
    button: "Don't allow"
    label: "Facebook friends access popup"
  - detect: "Turn on notifications"
    button: "Not now"
    label: "Notifications popup"
  - detect: "Add a bio"
    button: "Not now"
    label: "Bio nag — the bio is typed later, from the persona sheet"
  - detect: "Find friends"
    button: "Skip"
    label: "Follow suggestions — never a follow at creation (R16)"
  - detect: "Swipe up for more"
    button: "_back"
    label: "Feed tutorial"
    method: "back"

# R34: walked on the explorer profile, never on a character. The profile
# editor and the privacy screens were not mined and stay "verified": false.
tested_on:
  - device: "GeeLark explorer-us (Samsung Galaxy S20 emulated, Android 13, 720x1440)"
    app_version: "46.8.2"
    date: "2026-09-18"
    verified: [sign_up, use_phone_or_email, birthday_wheel, phone_tab, send_code, sms, password, nickname_derives_username, feed]
    notes: "email-first is a dead end (link your phone number, no Back); a reused number is refused ('already taken'); no captcha on the phone-first run"

name: ofmai_tiktok
display_name: OFMAI TikTok
description: TikTok warming, posting and replies for OFMAI characters — humanised, budgeted by the farm ledger
version: "0.1.0"
app_package: com.zhiliaoapp.musically
author: OFMAI
license: MIT

exports:
  actions:
    - name: open_app
      description: Launch TikTok on the For You feed
  workflows:
    - name: warm_session
      description: One humanised warming session driven by today's budget
      params:
        handle: { type: string, required: true }
        minutes: { type: number, required: false }
        comments: { type: string, required: false, description: "newline-separated ASCII comments" }
        niche: { type: string, required: false, description: "comma-separated hashtags" }
    - name: post_video
      description: Publish the newest gallery video with a caption
      params:
        handle: { type: string, required: true }
        caption: { type: string, required: true }
        aigc_label:
          type: boolean
          required: true
          description: >-
            AI-generated-content label, frozen on the publication when it was
            queued and copied here verbatim. No default: the action refuses to
            post without it, and refuses to post if the on-screen toggle does
            not end up in exactly this state.
    - name: comment_reply
      description: Answer the comments under the newest video. The texts come from OFMAI; the farm types them as they are.
      params:
        handle: { type: string, required: true }
        replies_ai: { type: string, required: false, description: "newline-separated ASCII replies; empty for an undeclared character" }
        replies_thanks: { type: string, required: false, description: "newline-separated ASCII replies" }
        replies_question: { type: string, required: false, description: "newline-separated ASCII replies" }
        max_comments: { type: number, required: false, description: "comments read in one pass (default 10)" }
    - name: dm_reply
      description: Answer unread DM threads once each. The texts come from OFMAI; the farm types them as they are.
      params:
        handle: { type: string, required: true }
        replies_ai: { type: string, required: false, description: "newline-separated ASCII replies" }
        replies_thanks: { type: string, required: false, description: "newline-separated ASCII replies" }
        replies_question: { type: string, required: false, description: "newline-separated ASCII replies" }

popup_detectors:
  - detect: "Continue editing"
    button: "Save draft"
    label: "Draft resume overlay"
  - detect: "connect with people"
    button: "Don't allow"
    label: "Contacts access popup"
  - detect: "access to your Facebook"
    button: "Don't allow"
    label: "Facebook friends access popup"
  - detect: "shared collections"
    button: "Not now"
    label: "Shared collections popup"
  - detect: "Turn on notifications"
    button: "Not now"
    label: "Notifications popup"
  - detect: "Swipe up for more"
    button: "_back"
    label: "Feed tutorial"
    method: "back"
  - detect: "Choose your interests"
    button: "Skip"
    label: "Interest picker"
  - detect: "Add a bio"
    button: "Not now"
    label: "Bio nag"

default_params:
  workflows:
    warm_session:
      handle: ""
      minutes: 0
      comments: ""
      niche: ""
    post_video:
      handle: ""
      caption: ""
      # aigc_label is deliberately absent: it has no default, and the action
      # refuses to publish without it (R2, R3).
    comment_reply:
      handle: ""
      replies_ai: ""
      replies_thanks: ""
      replies_question: ""
      max_comments: 10
    dm_reply:
      handle: ""
      replies_ai: ""
      replies_thanks: ""
      replies_question: ""

# Health signals ("You're tapping too fast", "Verify to continue", ...) are
# matched by gitd/farm/health.py and end the session; never dismissed here.

tested_on: []

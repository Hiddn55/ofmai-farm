# -- Create / post ------------------------------------------------------------------
upload_button:
  text: "Upload"
gallery_first_item:
  content_desc: "Video"
next_button:
  text: "Next"
caption_input:
  text: "Describe your video"
  resource_id: "com.zhiliaoapp.musically:id/caption_input"
post_button:
  text: "Post"
aigc_toggle:
  text: "AI-generated content"
# The "on" state of the toggle above. PostVideoAction re-reads the screen after
# tapping and refuses to publish unless the state matches params.aigc_label
# (docs/social/rules.md R3): three of the six characters declare themselves AI
# and three do not, so a post labelled the wrong way falsifies the whole test.
# [to verify on the device] TikTok may only expose the state as a `checked`
# attribute on the switch row rather than as its own labelled node — the action
# reads both.
aigc_toggle_on:
  content_desc: "AI-generated content, on"

# -- Own video: comments (comment_reply, E3.2) --------------------------------------
# [to verify on the device] every resource id below. `profile_grid_first_item`
# is the newest tile of the profile grid (not the upload gallery's
# `gallery_first_item` above); the two comment rows are what
# gitd/farm/replies.pair_comments() reads to build (author, text) pairs.
profile_grid_first_item:
  resource_id: "com.zhiliaoapp.musically:id/cover"
comment_author_row:
  resource_id: "com.zhiliaoapp.musically:id/title"
comment_text_row:
  resource_id: "com.zhiliaoapp.musically:id/desc"
comment_reply_link:
  text: "Reply"

# -- Inbox / direct messages (dm_reply, E3.3) ----------------------------------------
# [to verify on the device]. Incoming and outgoing bubbles are told apart by
# geometry (left half of the screen = incoming), not by a resource id.
dm_thread_row:
  resource_id: "com.zhiliaoapp.musically:id/title"
dm_message_row:
  resource_id: "com.zhiliaoapp.musically:id/chat_text"
dm_input:
  text: "Send a message"
  resource_id: "com.zhiliaoapp.musically:id/msg_edit"
dm_send:
  content_desc: "Send"
  text: "Send"

# TikTok UI elements — fallback chain: content_desc -> text -> resource_id -> coords
#
# STATUS: resource ids copied from ghost's public tiktok skill (verified on
# TikTok v44.3.3, ASUS ROG Phone II 1080x2400 and Galaxy A15); the rest comes
# from en-US accessibility labels and is NOT yet verified. Run Skill Miner on
# the first phone, fix here, fill `tested_on` in skill.yaml.
#
# Feed buttons carry counts in their label ("Like 12.3K"): actions/core.py
# matches by *contains*, these entries are the exact-match fast path.

# -- Bottom navigation ---------------------------------------------------------

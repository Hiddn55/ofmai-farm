# TikTok UI elements — fallback chain: content_desc -> text -> resource_id -> coords
#
# STATUS: VERIFIED on a device — GeeLark `explorer-us` (Android 13, 720x1440),
# TikTok 46.8.2, 2026-09-18, account @jordan.reed90. Source of truth:
# docs/social/screens-tiktok-actions.md.
#
# TikTok OBFUSCATES its resource ids (`a3d`, `uxt`, `g5l`…): they change from
# build to build and are useless as selectors. Its content-descs, on the other
# hand, are rich and carry the COUNTS — "Like video. 75.7K likes", "Read or add
# comments. 344 comments", "Follow jordan" — so everything below selects by
# description, and actions/core.py matches by *contains* (the count changes).
# A gesture is proven by a counter that moves (like, favourite, comment) or,
# for a follow, by the account's own "Following" count: the disappearance of a
# node proves NOTHING (a false positive was measured, §4 of the survey).
#
# `uiautomator dump` cannot read a screen while a video plays ("could not get
# idle state"): the feed and the search results are read after a pause tap,
# the sheets and the profile are read normally. The two coordinates below are
# for the 720x1440 screen and scaled by the adapter.

# -- Bottom navigation (text labels; verified 72 / 216 / 360 / 504 / 648 x 1322)
home_tab:
  text: "Home"
friends_tab:
  text: "Friends"
create_tab:
  content_desc: "Create"
  text: "Create"
inbox_tab:
  text: "Inbox"
profile_tab:
  text: "Profile"

# -- For You feed: the action rail of the visible video (x≈670) --------------------
# "Like video. 75.7K likes" — the count is in the label
like_button:
  content_desc: "Like video"
# the same button once lit: "Video liked", no count in the label any more —
# the number stays in the text node inside the button (3 -> 4, 2026-09-22).
# The adapter reads the count under either label and never taps this one.
like_button_liked:
  content_desc: "Video liked"
# "Read or add comments. 344 comments" — or "Add 1st comments" when there are none
comment_button:
  content_desc: "Read or add comments"
# "Add or remove this video from Favorites." — NO count in the label: the
# number is the text node inside the button's lower part (2026-09-22)
favorite_button:
  content_desc: "Add or remove this video from Favorites"
share_button:
  content_desc: "Share video"
# "Follow <handle>" — the small button UNDER the avatar: 35 px apart, so the
# adapter taps its lower edge, never its centre
follow_on_feed:
  content_desc: "Follow "
# "<handle>'s profile" — the avatar above the follow button
author_avatar:
  content_desc: " profile"

# -- Comments sheet (static: readable by the tree) ---------------------------------------
comment_input:
  text: "Add comment..."
# the send arrow has no label: (657, 858) with the keyboard open, on 720x1440
comment_send:
  x: 657
  y: 858
comment_close:
  x: 683
  y: 471
comment_reply_link:
  text: "Reply"

# -- Profile (own or someone else's) ------------------------------------------------------
# the three counters are labelled text nodes; the number sits next to the label
following_label:
  text: "Following"
followers_label:
  text: "Followers"
likes_label:
  text: "Likes"
follow_button:
  text: "Follow"
following_button:
  text: "Following"
back_button:
  content_desc: "Back"

# -- Search ----------------------------------------------------------------------------------
# magnifier -> field -> KEYCODE_ENTER. Two nodes carry the desc "Search" on the
# feed (2026-09-22): the magnifier top right (y≈86) and the icon of the
# "Search · <suggestion>" bar at the bottom (y≈1254) — the adapter takes the
# topmost. On the search page, the text "Search" is the SUBMIT button next to
# the field, and the field's own text is a rotating placeholder ("Erling
# Haaland Funny Moments"): the field is found by its class, nothing else.
# The results dumped fine on 46.8.2 (tabs Top / Users / LIVE / Videos), but a
# playing thumbnail can still blank them: they are only scrolled.
search_icon:
  content_desc: "Search"
search_box:
  class_name: "android.widget.EditText"

# -- Create / post (verified: Create -> gallery -> Next -> title -> Post -> Post Now)
upload_button:
  text: "Upload"
gallery_first_item:
  content_desc: "Video"
next_button:
  text: "Next"
caption_input:
  text: "Describe your video"
  resource_id: "com.zhiliaoapp.musically:id/caption_input"
post_button:
  text: "Post"
# the "Post video publicly?" confirmation that follows Post
post_now_button:
  text: "Post Now"
aigc_toggle:
  text: "AI-generated content"
# The "on" state of the toggle above. PostVideoAction re-reads the screen after
# tapping and refuses to publish unless the state matches params.aigc_label
# (docs/social/rules.md R3). TikTok may only expose the state as a `checked`
# attribute on the switch row rather than as its own labelled node — the
# action reads both. [not exercised: the explorer's post carried no label]
aigc_toggle_on:
  content_desc: "AI-generated content, on"

# -- Own video: comments (comment_reply, E3.2) -------------------------------------------
# The reply itself was verified (345 -> 346 comments). Row ids read on 46.8.2
# (2026-09-22): author `title`, body `f41` (obfuscated — it WILL change), time
# `enj`, then the "Reply" link. The sheet of one's own video opens on a
# caption header — `title`, caption `f6u`, "3d ago" in `desc` — which is why
# `desc` is NOT the body: paired with it, the caption passed for a comment.
# The adapter keeps a row only when a "Reply" link sits under its body, and
# falls back to the "Reply" links themselves once `f41` is renamed.
profile_grid_first_item:
  resource_id: "com.zhiliaoapp.musically:id/cover"
comment_author_row:
  resource_id: "com.zhiliaoapp.musically:id/title"
comment_text_row:
  resource_id: "com.zhiliaoapp.musically:id/f41"

# -- Inbox / direct messages (dm_reply, E3.3) — NOT exercised (no incoming message)
dm_thread_row:
  resource_id: "com.zhiliaoapp.musically:id/title"
dm_message_row:
  resource_id: "com.zhiliaoapp.musically:id/chat_text"
dm_input:
  text: "Send a message"
  resource_id: "com.zhiliaoapp.musically:id/msg_edit"
dm_send:
  content_desc: "Send"
  text: "Send"

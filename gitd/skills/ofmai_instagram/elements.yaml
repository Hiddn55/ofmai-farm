# Instagram UI elements — fallback chain: content_desc -> text -> resource_id -> coords
#
# STATUS: written from the en-US accessibility labels of Instagram for Android
# (2026). NOT yet verified on a device: run Skill Miner on the first phone,
# then fix the ids here and fill `tested_on` in skill.yaml. Keep content_desc
# first: labels survive app updates far better than resource ids.
#
# Many buttons are found by *contains* matching in actions/core.py (e.g. the
# like button's label is "Like" or "Liked"; a story's label ends with
# "'s story"). Entries below are the exact-match fast path.

# -- Bottom navigation ---------------------------------------------------------
home_tab:
  content_desc: "Home"
  resource_id: "com.instagram.android:id/feed_tab"
search_tab:
  content_desc: "Search and explore"
  resource_id: "com.instagram.android:id/search_tab"
reels_tab:
  content_desc: "Reels"
  resource_id: "com.instagram.android:id/clips_tab"
create_tab:
  content_desc: "Create"
  resource_id: "com.instagram.android:id/creation_tab"
profile_tab:
  content_desc: "Profile"
  resource_id: "com.instagram.android:id/profile_tab"

# -- Reels viewer --------------------------------------------------------------
like_button:
  content_desc: "Like"
liked_button:
  content_desc: "Liked"
comment_button:
  content_desc: "Comment"
share_button:
  content_desc: "Share"
more_button:
  content_desc: "More options"
save_button:
  content_desc: "Save"
author_avatar:
  content_desc: "Profile picture"
author_name:
  resource_id: "com.instagram.android:id/clips_username"

# -- Comments sheet -------------------------------------------------------------
comment_input:
  text: "Add a comment…"
  resource_id: "com.instagram.android:id/layout_comment_thread_edittext"
comment_post:
  content_desc: "Post"
  resource_id: "com.instagram.android:id/layout_comment_thread_post_button"

# -- Profile ---------------------------------------------------------------------
follow_button:
  text: "Follow"
following_button:
  text: "Following"
back_button:
  content_desc: "Back"

# -- Search --------------------------------------------------------------------
search_input:
  resource_id: "com.instagram.android:id/action_bar_search_edit_text"

# -- Stories (home) ---------------------------------------------------------------
your_story:
  content_desc: "Your story"

# -- Create / post ------------------------------------------------------------------
create_reel:
  text: "REEL"
create_post:
  text: "POST"
gallery_first_item:
  resource_id: "com.instagram.android:id/gallery_grid_item_thumbnail"
next_button:
  content_desc: "Next"
caption_input:
  text: "Write a caption..."
  resource_id: "com.instagram.android:id/caption_input_text_view"
share_button_final:
  text: "Share"
create_story:
  text: "STORY"
# The composer's share button. `your_story` above (content-desc "Your story") is
# the home feed's story ring; in the story composer the same words appear as the
# button that publishes. PostStoryAction tries the element first, then the text.
# [to verify on the device] the composer's exact label ("Your story" vs
# "Add to story" vs "Share to > Your story"), and whether Instagram asks for a
# confirmation after the tap.
story_share:
  text: "Your story"

# -- Own post: comments (comment_reply, E3.2) -------------------------------------
# [to verify on the device] all four resource ids below. `profile_grid_first_item`
# is the newest tile of the profile grid; the two comment rows are what
# gitd/farm/replies.pair_comments() reads to build (author, text) pairs.
profile_grid_first_item:
  resource_id: "com.instagram.android:id/media_thumbnail"
comment_author_row:
  resource_id: "com.instagram.android:id/row_comment_textview_username"
comment_text_row:
  resource_id: "com.instagram.android:id/row_comment_textview_comment"
comment_reply_link:
  text: "Reply"

# -- Direct messages (dm_reply, E3.3) ---------------------------------------------
# [to verify on the device] all of these. Incoming and outgoing bubbles are told
# apart by geometry (left half = incoming), not by a resource id, so only the
# row id has to be right for the "never answer without an incoming message"
# rule to hold.
direct_inbox:
  content_desc: "Direct"
dm_thread_row:
  resource_id: "com.instagram.android:id/row_inbox_username"
dm_message_row:
  resource_id: "com.instagram.android:id/direct_text_message_text_view"
dm_input:
  text: "Message..."
  resource_id: "com.instagram.android:id/row_thread_composer_edittext"
dm_send:
  text: "Send"
  content_desc: "Send"

name: ofmai_instagram
display_name: OFMAI Instagram
description: Instagram warming, posting and replies for OFMAI characters — humanised, budgeted by the farm ledger
version: "0.2.0"
app_package: com.instagram.android
author: OFMAI
license: MIT

exports:
  actions:
    - name: open_app
      description: Launch Instagram on the home feed
    - name: go_reels
      description: Open the Reels tab
  workflows:
    - name: warm_session
      description: One humanised warming session driven by today's budget
      params:
        handle: { type: string, required: true }
        minutes: { type: number, required: false }
        comments: { type: string, required: false, description: "newline-separated ASCII comments" }
        niche: { type: string, required: false, description: "comma-separated hashtags" }
    - name: post_video
      description: Publish a Reel from the device gallery (most recent item) with a caption
      params:
        handle: { type: string, required: true }
        caption: { type: string, required: true }
    - name: post_photo
      description: Publish a feed photo from the device gallery (most recent item) with a caption
      params:
        handle: { type: string, required: true }
        caption: { type: string, required: true }
    - name: post_story
      description: Publish the most recent gallery item as a story — no caption, spends story_post and never the post budget
      params:
        handle: { type: string, required: true }
    - name: comment_reply
      description: Answer the comments under the newest post. The texts come from OFMAI; the farm types them as they are.
      params:
        handle: { type: string, required: true }
        replies_ai: { type: string, required: false, description: "newline-separated ASCII replies; empty for an undeclared character" }
        replies_thanks: { type: string, required: false, description: "newline-separated ASCII replies" }
        replies_question: { type: string, required: false, description: "newline-separated ASCII replies" }
        max_comments: { type: number, required: false, description: "comments read in one pass (default 10)" }
    - name: dm_reply
      description: Answer unread DM threads once each. The texts come from OFMAI; the farm types them as they are.
      params:
        handle: { type: string, required: true }
        replies_ai: { type: string, required: false, description: "newline-separated ASCII replies" }
        replies_thanks: { type: string, required: false, description: "newline-separated ASCII replies" }
        replies_question: { type: string, required: false, description: "newline-separated ASCII replies" }

# `button` is matched on text or content-desc, exactly. The first three were
# met on the device (screens-instagram-actions.md §2).
popup_detectors:
  - detect: "Introducing"
    button: "Not now"
    label: "Promotional interstitial (Instagram map, instants…) — lands at any moment"
  - detect: "Stories archive"
    button: "OK"
    label: "First-story notice"
  - detect: "Collect the posts you love"
    button: "_back"
    method: "back"
    label: "Saved sheet after the first save — closed with Back (seen 2026-09-22)"
  - detect: "Turn on Notifications"
    button: "Not Now"
    label: "Notifications popup"
  - detect: "Save Your Login Info"
    button: "Not Now"
    label: "Save login popup"
  - detect: "Add Account"
    button: "Not Now"
    label: "Add account popup"
  - detect: "Allow Instagram to access"
    button: "Don’t allow"
    label: "Permission request"
  - detect: "Add Instagram to your Home screen"
    button: "Not now"
    label: "Home screen shortcut"
  - detect: "Welcome to Reels"
    button: "OK"
    label: "Reels intro"
  - detect: "Update Instagram"
    button: "Not Now"
    label: "Update nag"

default_params:
  workflows:
    warm_session:
      handle: ""
      minutes: 0
      comments: ""
      niche: ""
    post_video:
      handle: ""
      caption: ""
    post_photo:
      handle: ""
      caption: ""
    post_story:
      handle: ""
    comment_reply:
      handle: ""
      replies_ai: ""
      replies_thanks: ""
      replies_question: ""
      max_comments: 10
    dm_reply:
      handle: ""
      replies_ai: ""
      replies_thanks: ""
      replies_question: ""

# Health signals ("Action Blocked", "Confirm it's you", ...) are matched by
# gitd/farm/health.py, not here: they end the session instead of being dismissed.

# R34: every id of elements.yaml and every gesture of actions/ were read from
# uiautomator dumps and exercised on this device, on the explorer account
# (never a character). Source: docs/social/screens-instagram-actions.md.
tested_on:
  - device: "GeeLark explorer-us (Samsung Galaxy S20 emulated, Android 13, 720x1440)"
    app_version: "443.0.0.48.82"
    date: "2026-09-16"
    verified: [view, like, save, follow, comment, comment_reply, post_photo, post_story, story_view, profile_visit, search]
    unverified: [post_video, dm_reply]
    notes: "like by Like->Liked, save by Add to Saved->Remove from saved, follow by Follow x->Following x, story by unseen->seen; dm_reply needs an incoming message, post_video a video in the gallery"
